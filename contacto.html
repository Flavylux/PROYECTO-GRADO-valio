<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img" aria-label="Marca personal">
            <rect x="6" y="6" width="52" height="52" rx="16" fill="#0f172a" opacity="0.25"></rect>
            <path d="M22 24c0-8 6-14 14-14 8 0 14 6 14 14 0 6-4 12-10 14l-4 2-4-2c-6-2-10-8-10-14z" fill="#f8fafc"></path>
            <path d="M20 32c0-8 6-14 14-14" stroke="#6ee7f9" stroke-width="3" fill="none" stroke-linecap="round"></path>
            <path d="M44 32c0-8-6-14-14-14" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round"></path>
            <path d="M24 38c0 6 4 10 10 10 6 0 10-4 10-10" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"></path>
          </svg>
        </span>
        <span class="brand-text">Andrés Dev</span>
      </a>
      <nav class="nav" aria-label="Navegación secundaria">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="unidad1.html">Unidad 1</a>
        <a class="nav-link" href="unidad2.html">Unidad 2</a>
        <a class="nav-link" href="unidad3.html">Unidad 3</a>
      </nav>
    </header>

    <main>
      <section class="content-card reveal">
        <p class="eyebrow">Contacto</p>
        <h1>Hablemos</h1>
        <p>Si quieres dejar un mensaje, comentario o una propuesta, puedes usar este formulario.</p>

        <form class="contact-form" id="contact-form" action="contacto" method="post">
          <label>
            Nombre
            <input type="text" name="nombre" required />
          </label>

          <label>
            Correo
            <input type="email" name="correo" required />
          </label>

          <label>
            Mensaje
            <textarea name="mensaje" rows="5" required></textarea>
          </label>

          <button class="btn btn-primary" type="submit">Enviar mensaje</button>
          <p id="form-message" class="form-message"></p>
        </form>
      </section>
    </main>
  </div>

  <footer class="footer">
    <p>© <span id="year"></span> Andrés Plazarte</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
